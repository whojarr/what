{% extends "base.html" %}
{% block title %}Invent — WHAT{% endblock %}
{% block main_class %}main-wide{% endblock %}
{% block content %}
<div id="invent-root"
     data-api-base="{{ api_base }}"
     data-game-id="{{ game_id }}"
     data-region-id="{{ region_id or '' }}">
  <div id="invent-materials"><p class="muted world-panel-loading">Loading…</p></div>
  <section class="panel">
    <h2>Propose an invention</h2>
    <form id="invent-form">
      <textarea name="idea" rows="4" placeholder="e.g. sewing, smelting, sharpened stones, bone needles, cooking meat" required></textarea>
      <label>Place in
        <select name="region_id" id="invent-region-select">
          <option value="">Loading regions…</option>
        </select>
      </label>
      <button type="submit" class="primary">Interpret idea</button>
    </form>
    <div id="invent-error"></div>
  </section>
  <div id="invent-result"></div>
</div>
{% endblock %}
{% block page_scripts %}
<script src="{{ url_for('static', filename='invent.js') }}"></script>
{% endblock %}
