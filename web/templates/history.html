{% extends "base.html" %}
{% block title %}History — WHAT{% endblock %}
{% block content %}
<div id="history-root"
     data-api-base="{{ api_base }}"
     data-game-id="{{ game_id }}">
  <section class="panel">
    <h2>Memory search</h2>
    <form id="history-search-form">
      <input type="text" name="q" placeholder="Search past ideas and events">
      <button type="submit">Search</button>
    </form>
    <ul id="history-records"><li class="muted">Loading…</li></ul>
  </section>
  <section class="panel">
    <h2>Event log</h2>
    <ul id="history-events"><li class="muted">Loading…</li></ul>
  </section>
</div>
{% endblock %}
{% block page_scripts %}
<script src="{{ url_for('static', filename='history.js') }}"></script>
{% endblock %}
