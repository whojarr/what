{% extends "base.html" %}
{% block title %}Start — WHAT{% endblock %}
{% block content %}
<section class="panel hero">
  <h2>You wake in a cave</h2>
  <p>Fire and water are your first <strong>components</strong> (machines). Combine <strong>materials</strong> at Discover to make <strong>objects</strong> — seats, tables, shelters — or new components (tools).</p>
  <form action="{{ url_for('start_game') }}" method="post">
    <label>World seed <input type="number" name="seed" value="42"></label>
    <button type="submit" class="primary">Enter the cave</button>
  </form>
</section>
{% endblock %}
