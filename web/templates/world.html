{% extends "base.html" %}
{% block title %}Cave — WHAT{% endblock %}
{% block main_class %}main-wide{% endblock %}
{% block content %}
<div id="world-root"
     data-api-base="{{ api_base }}"
     data-game-id="{{ game_id }}"
     data-preview-limit="{{ preview_limit }}">
  <div id="world-feedback"></div>
  <div id="world-app" class="world-page-grid">
    <p class="muted world-panel-loading">Loading cave…</p>
  </div>
  <div id="world-actions" class="actions"></div>

  <div id="world-side-panel" class="world-side-panel" aria-hidden="true">
    <div class="world-side-panel-backdrop"></div>
    <aside class="world-side-panel-drawer" role="dialog" aria-modal="true" aria-labelledby="world-panel-title">
      <header class="world-side-panel-head">
        <h2 id="world-panel-title" class="world-side-panel-title"></h2>
        <button type="button" class="world-side-panel-close" aria-label="Close">×</button>
      </header>
      <div class="world-side-panel-body"></div>
    </aside>
  </div>
</div>
{% endblock %}
{% block page_scripts %}
<script src="{{ url_for('static', filename='world.js') }}"></script>
{% endblock %}
