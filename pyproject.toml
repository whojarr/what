[tool.poetry]
name = "civsim"
version = "0.1.0"
description = "AI civilization simulation - playable foundation"
authors = ["CivSim"]
readme = "README.md"
packages = [{ include = "civsim", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
pydantic = "^2.9.0"
pyyaml = "^6.0.2"
openai = "^1.54.0"
flask = "^3.0.0"
httpx = "^0.27.0"
python-dotenv = "^1.0.1"
mangum = "^0.19.0"
pillow = "^11.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
